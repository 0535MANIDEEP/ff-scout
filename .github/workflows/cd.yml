name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pre-deploy gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: file:./test.db
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build production bundle
        run: npm run build

      # Hook for the deploy itself. On Vercel this is automatic when the project
      # is connected — the workflow exits after build. If deploying elsewhere,
      # add a step that calls the platform API.
      - name: Report ready for deployment
        run: echo "Ready — Vercel will pick up this push on main."
